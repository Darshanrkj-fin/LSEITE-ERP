name = "lseite-erp-cron"
main = "index.js"
compatibility_date = "2026-09-05"

# Same two schedules as the old vercel.json crons: GST notification check
# (weekly, Monday 06:00 UTC) and subscription-cycle generation (daily,
# 05:00 UTC). Keep this in sync with ENDPOINT_BY_CRON in index.js.
[triggers]
crons = ["0 6 * * 1", "0 5 * * *"]

[vars]
# Set this to your deployed Pages project's origin, e.g.
# "https://lseite-erp.pages.dev" (or your custom domain).
PAGES_URL = ""

# CRON_SECRET is a secret, not a plain var — set it with:
#   wrangler secret put CRON_SECRET
# (from inside this cron-worker/ folder), using the exact same value as
# the Pages project's own CRON_SECRET env var.
