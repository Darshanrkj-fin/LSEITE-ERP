name = "lseite-erp"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-05"

# No nodejs_compat flag needed — functions/api/*.js were written against
# the Workers runtime's own Web APIs (fetch, Response, crypto.subtle,
# btoa) rather than Node's Buffer/crypto module, so there's nothing here
# that needs the Node compatibility shim.

# Observability (Logs/Traces) is NOT configurable here for a classic Pages
# project — `wrangler pages deploy` rejects an [observability] block
# outright ("Configuration file for Pages projects does not support
# observability"), even though the dashboard's own "sync your config"
# banner suggests one. Toggle Logs/Traces directly in the dashboard
# (Settings > Observability) instead — that's a runtime setting for this
# project type, not something wrangler.toml manages.
